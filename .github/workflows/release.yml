name: release

# Push a v* tag -> build every platform -> publish a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The release is published, not drafted, so `curl -L .../latest/download/<name>`
# resolves. A draft release is invisible to that URL and to anyone but the repo
# owner, which would defeat the point of downloading it on a fresh machine.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # one platform failing must not cancel the others
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri on Linux needs the system webview and its build dependencies.
      # This list is Tauri's own — an earlier version added libappindicator3-dev,
      # which no longer exists on 22.04 (superseded by the ayatana package) and
      # failed the whole job at apt-get.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --no-install-suggests \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.label }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "agentport ${{ github.ref_name }}"
          releaseBody: |
            Download the build for your machine below, or fetch it directly.

            **Windows**
            ```powershell
            curl.exe -L -o agentport-setup.exe https://github.com/${{ github.repository }}/releases/latest/download/agentport-windows-x64.exe
            ```

            **macOS (Apple Silicon)**
            ```bash
            curl -L -o agentport.dmg https://github.com/${{ github.repository }}/releases/latest/download/agentport-macos-arm64.dmg
            ```

            **macOS (Intel)**
            ```bash
            curl -L -o agentport.dmg https://github.com/${{ github.repository }}/releases/latest/download/agentport-macos-intel.dmg
            ```

            **Linux**
            ```bash
            curl -L -o agentport.AppImage https://github.com/${{ github.repository }}/releases/latest/download/agentport-linux-x64.AppImage
            chmod +x agentport.AppImage && ./agentport.AppImage
            ```

            ---

            Neither build is code-signed.

            **Windows** — SmartScreen will warn on first run: *More info → Run anyway*.
            **macOS** — right-click the app → Open, or System Settings → Privacy & Security → *Open Anyway*.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
          # Stable, platform-labelled filenames are what make
          # `releases/latest/download/<name>` resolvable. The action's own
          # default embeds the version, which moves every release.
          releaseAssetNamePattern: "agentport-${{ matrix.label }}[ext]"

