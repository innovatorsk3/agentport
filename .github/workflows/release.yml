name: release

# Push a v* tag -> build every platform -> publish a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The release is published, not drafted, so `curl -L .../latest/download/<name>`
# resolves. A draft release is invisible to that URL and to anyone but the repo
# owner, which would defeat the point of downloading it on a fresh machine.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # one platform failing must not cancel the others
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri on Linux needs the system webview and its build dependencies.
      # This list is Tauri's own — an earlier version added libappindicator3-dev,
      # which no longer exists on 22.04 (superseded by the ayatana package) and
      # failed the whole job at apt-get.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --no-install-suggests \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.label }}

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentport-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agentport-*
          path: artifacts
          merge-multiple: true

      - name: Publish stable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p release-assets

          windows=$(find artifacts -type f -name '*-setup.exe' -print -quit)
          arm_dmg=$(find artifacts -type f -name '*.dmg' \( -name '*aarch64*' -o -name '*arm64*' \) -print -quit)
          intel_dmg=$(find artifacts -type f -name '*.dmg' \( -name '*x64*' -o -name '*x86_64*' \) -print -quit)
          linux_appimage=$(find artifacts -type f -name '*.AppImage' -print -quit)
          linux_deb=$(find artifacts -type f -name '*.deb' -print -quit)

          test -n "$windows"
          test -n "$arm_dmg"
          test -n "$intel_dmg"
          test -n "$linux_appimage"
          test -n "$linux_deb"

          cp "$windows" release-assets/agentport-windows-x64.exe
          cp "$arm_dmg" release-assets/agentport-macos-arm64.dmg
          cp "$intel_dmg" release-assets/agentport-macos-intel.dmg
          cp "$linux_appimage" release-assets/agentport-linux-x64.AppImage
          cp "$linux_deb" release-assets/agentport-linux-x64.deb

          notes=$(cat <<'EOF'
          Download the build for your machine below, or fetch it directly.

          Windows:
          curl.exe --fail --location --show-error -o agentport-setup.exe https://github.com/REPO/releases/latest/download/agentport-windows-x64.exe

          Builds are not code-signed. Windows SmartScreen and macOS Gatekeeper may ask for confirmation on first launch.
          EOF
          )
          notes=${notes//REPO/$REPO}

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release-assets/* --repo "$REPO" \
              --title "agentport $TAG" --notes "$notes"
          fi
